name: Validate Index

on:
  pull_request:
    paths:
      - 'index.json'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths: ['index.json']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 结构与字段校验（纯标准库，无第三方依赖）
        run: python scripts/validate_index.py

      - name: JSON Schema 校验
        run: |
          python -m pip install --quiet jsonschema
          python - <<'PY'
          import json
          import jsonschema

          with open('index.json', encoding='utf-8') as handle:
              data = json.load(handle)
          with open('schema/index.schema.json', encoding='utf-8') as handle:
              schema = json.load(handle)
          jsonschema.validate(data, schema)
          print('JSON Schema 校验通过')
          PY
