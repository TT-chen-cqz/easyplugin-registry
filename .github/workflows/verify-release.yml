name: Verify Release Assets

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: '要核验的条目 id；留空表示核验全部'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 下载 Release 附件并重算 sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_release.py "${{ inputs.package_id }}"
